name: Collect mathematics feedback
on:
  issues:
    types: [opened, edited, deleted, closed, reopened]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect-feedback.yml'
      - 'scripts/collect_feedback.py'
permissions:
  contents: write
  issues: read
concurrency:
  group: math7-feedback-document
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download trusted collector from the main branch
        env:
          FEEDBACK_TOKEN: ${{ github.token }}
          FEEDBACK_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['FEEDBACK_REPOSITORY'] + '/contents/scripts/collect_feedback.py?ref=main'
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['FEEDBACK_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'math7-feedback-collector'})
          with urllib.request.urlopen(req, timeout=45) as r:
              obj = json.load(r)
          pathlib.Path('collector.py').write_bytes(base64.b64decode(obj['content']))
          PY
      - name: Rebuild the shared feedback document
        env:
          FEEDBACK_TOKEN: ${{ github.token }}
          FEEDBACK_REPOSITORY: ${{ github.repository }}
        run: python3 collector.py
